<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MASkills pipeline stages</title>
<link href="https://fonts.googleapis.com/css?family=Google+Sans:400,500,700|Noto+Sans:400,600" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#fff;}
  body{width:1600px;height:900px;overflow:hidden;
       font-family:'Google Sans','Noto Sans',-apple-system,Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased;}
  .wrap{position:relative;width:1600px;height:900px;}

  .col{position:absolute;top:0;width:368px;visibility:hidden;}
  .c1{left:28px}.c2{left:420px}.c3{left:812px}.c4{left:1204px}
  body.s1 .c1,
  body.s2 .c1,body.s2 .c2,
  body.s3 .c1,body.s3 .c2,body.s3 .c3,
  body.s4 .c1,body.s4 .c2,body.s4 .c3,body.s4 .c4{visibility:visible}

  .badge{position:absolute;top:28px;left:50%;transform:translateX(-50%);
         background:#1a73e8;color:#fff;font-size:19px;font-weight:500;
         padding:7px 20px;border-radius:20px;white-space:nowrap;letter-spacing:.2px;}
  .c4 .badge{background:#174ea6}

  .title{position:absolute;top:86px;width:368px;text-align:center;
         font-size:31px;line-height:40px;font-weight:500;color:#202124;letter-spacing:-.3px;}

  .panel{position:absolute;top:200px;width:368px;height:674px;
         background:#e6f0fb;border-radius:16px;}

  .arrows .a1,.arrows .a2,.arrows .a3{visibility:hidden}
  body.s2 .a1,
  body.s3 .a1,body.s3 .a2,
  body.s4 .a1,body.s4 .a2,body.s4 .a3{visibility:visible}
  .arrows{position:absolute;top:0;left:0}
</style>
</head>
<body class="s4">

<svg width="0" height="0" style="position:absolute">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9aa0a6"/>
    </marker>
    <marker id="arRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b60000"/>
    </marker>
    <marker id="arBig" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#a7a0c8"/>
    </marker>
  </defs>
</svg>

<div class="wrap">

  <svg class="arrows" width="1600" height="900">
    <line class="a1" x1="282" y1="46" x2="528" y2="46" stroke="#a7a0c8" stroke-width="3" marker-end="url(#arBig)"/>
    <line class="a2" x1="674" y1="46" x2="920" y2="46" stroke="#a7a0c8" stroke-width="3" marker-end="url(#arBig)"/>
    <line class="a3" x1="1066" y1="46" x2="1277" y2="46" stroke="#a7a0c8" stroke-width="3" marker-end="url(#arBig)"/>
  </svg>

  <!-- ===================== STAGE 1 ===================== -->
  <div class="col c1">
    <div class="badge">Stage 1</div>
    <div class="title">Multi-Agent<br>Skill Execution</div>
    <div class="panel">
      <svg width="368" height="674" viewBox="0 0 368 674">
        <!-- skill library -->
        <rect x="24" y="22" width="320" height="140" rx="11" fill="#fff" stroke="#d2e0ef"/>
        <rect x="40" y="36" width="14" height="12" rx="2.5" fill="#1a73e8" opacity=".85"/>
        <text x="62" y="47" font-size="15" font-weight="600" fill="#202124">Skill Library</text>
        <g font-size="12.5" font-family="ui-monospace,Menlo,monospace">
          <rect x="40" y="60" width="288" height="28" rx="7" fill="#f1f5fa" stroke="#dde6f0"/>
          <text x="54" y="78" fill="#1a73e8">skill.yaml</text>
          <text x="146" y="78" fill="#5f6368" font-family="'Google Sans',sans-serif" font-size="12">name + when to invoke</text>

          <rect x="40" y="94" width="288" height="28" rx="7" fill="#f1f5fa" stroke="#dde6f0"/>
          <text x="54" y="112" fill="#1a73e8">SKILL.md</text>
          <text x="146" y="112" fill="#5f6368" font-family="'Google Sans',sans-serif" font-size="12">the procedure itself</text>

          <rect x="40" y="128" width="288" height="28" rx="7" fill="#f1f5fa" stroke="#dde6f0"/>
          <text x="54" y="146" fill="#1a73e8">resources/</text>
          <text x="146" y="146" fill="#5f6368" font-family="'Google Sans',sans-serif" font-size="12">scripts, references, tools</text>
        </g>

        <line x1="184" y1="162" x2="184" y2="192" stroke="#9aa0a6" stroke-width="1.6" marker-end="url(#ar)"/>
        <text x="196" y="184" font-size="12" fill="#5f6368">loaded on demand</text>

        <!-- agents, decentralized peers -->
        <g stroke="#c6d4e2" stroke-width="1.6">
          <line x1="76" y1="240" x2="184" y2="240"/>
          <line x1="184" y1="240" x2="292" y2="240"/>
        </g>
        <g>
          <rect x="24" y="200" width="104" height="80" rx="11" fill="#fff" stroke="#d2e0ef"/>
          <circle cx="76" cy="228" r="13" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
          <text x="76" y="233" text-anchor="middle" font-size="12" font-weight="700" fill="#1a73e8">A</text>
          <text x="76" y="258" text-anchor="middle" font-size="12" font-weight="600" fill="#202124">Retrieval</text>
          <text x="76" y="272" text-anchor="middle" font-size="12" fill="#5f6368">3 skills</text>

          <rect x="132" y="200" width="104" height="80" rx="11" fill="#fff" stroke="#d2e0ef"/>
          <circle cx="184" cy="228" r="13" fill="#e6f4ea" stroke="#137333" stroke-width="1.5"/>
          <text x="184" y="233" text-anchor="middle" font-size="12" font-weight="700" fill="#137333">B</text>
          <text x="184" y="258" text-anchor="middle" font-size="12" font-weight="600" fill="#202124">Verify</text>
          <text x="184" y="272" text-anchor="middle" font-size="12" fill="#5f6368">2 skills</text>

          <rect x="240" y="200" width="104" height="80" rx="11" fill="#fff" stroke="#d2e0ef"/>
          <circle cx="292" cy="228" r="13" fill="#f3e8fd" stroke="#7b1fa2" stroke-width="1.5"/>
          <text x="292" y="233" text-anchor="middle" font-size="12" font-weight="700" fill="#7b1fa2">C</text>
          <text x="292" y="258" text-anchor="middle" font-size="12" font-weight="600" fill="#202124">Plan · Tools</text>
          <text x="292" y="272" text-anchor="middle" font-size="12" fill="#5f6368">4 skills</text>
        </g>
        <text x="184" y="300" text-anchor="middle" font-size="12" fill="#5f6368">decentralized peer coordination</text>

        <line x1="184" y1="308" x2="184" y2="332" stroke="#9aa0a6" stroke-width="1.6" marker-end="url(#ar)"/>

        <!-- skill trace -->
        <rect x="24" y="340" width="320" height="150" rx="11" fill="#fff" stroke="#d2e0ef"/>
        <text x="40" y="364" font-size="13.5" font-weight="600" fill="#202124">Skill trace ξ</text>
        <text x="128" y="364" font-size="12" fill="#5f6368">— which skill fired, when</text>
        <g font-size="12" font-family="ui-monospace,Menlo,monospace" text-anchor="middle">
          <text x="44" y="394" font-size="12" fill="#1a73e8" font-weight="700" text-anchor="start">A</text>
          <rect x="64" y="380" width="80" height="24" rx="6" fill="#e8f0fe"/><text x="104" y="396" fill="#174ea6">a₀ , k₀</text>
          <rect x="152" y="380" width="80" height="24" rx="6" fill="#f1f5fa"/><text x="192" y="396" fill="#80868b">a₁ , ∅</text>
          <rect x="240" y="380" width="80" height="24" rx="6" fill="#e8f0fe"/><text x="280" y="396" fill="#174ea6">a₂ , k₂</text>

          <text x="44" y="428" font-size="12" fill="#137333" font-weight="700" text-anchor="start">B</text>
          <rect x="64" y="414" width="80" height="24" rx="6" fill="#f1f5fa"/><text x="104" y="430" fill="#80868b">a₀ , ∅</text>
          <rect x="152" y="414" width="80" height="24" rx="6" fill="#e6f4ea"/><text x="192" y="430" fill="#137333">a₁ , k₁</text>
          <rect x="240" y="414" width="80" height="24" rx="6" fill="#f1f5fa"/><text x="280" y="430" fill="#80868b">a₂ , ∅</text>

          <text x="44" y="462" font-size="12" fill="#7b1fa2" font-weight="700" text-anchor="start">C</text>
          <rect x="64" y="448" width="80" height="24" rx="6" fill="#f3e8fd"/><text x="104" y="464" fill="#7b1fa2">a₀ , k₀</text>
          <rect x="152" y="448" width="80" height="24" rx="6" fill="#f3e8fd"/><text x="192" y="464" fill="#7b1fa2">a₁ , k₁</text>
          <rect x="240" y="448" width="80" height="24" rx="6" fill="#f1f5fa"/><text x="280" y="464" fill="#80868b">a₂ , ∅</text>
        </g>

        <rect x="24" y="514" width="320" height="136" rx="11" fill="#d7e7f8"/>
        <text x="44" y="542" font-size="13" font-weight="600" fill="#174ea6">Skills are callable tools</text>
        <text x="44" y="566" font-size="12.5" fill="#3c4043">The agent decides whether to invoke a</text>
        <text x="44" y="585" font-size="12.5" fill="#3c4043">skill, which one, and how to compose</text>
        <text x="44" y="604" font-size="12.5" fill="#3c4043">several — so every invocation is visible</text>
        <text x="44" y="623" font-size="12.5" fill="#3c4043">in the log, and the context stays compact</text>
        <text x="44" y="642" font-size="12.5" fill="#3c4043">via progressive disclosure.</text>
      </svg>
    </div>
  </div>

  <!-- ===================== STAGE 2 ===================== -->
  <div class="col c2">
    <div class="badge">Stage 2</div>
    <div class="title">Skill Credit<br>Assignment</div>
    <div class="panel">
      <svg width="368" height="674" viewBox="0 0 368 674">
        <rect x="24" y="22" width="320" height="58" rx="11" fill="#fff" stroke="#d2e0ef"/>
        <text x="184" y="44" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Trajectory + skill traces</text>
        <text x="184" y="66" text-anchor="middle" font-size="12.5" fill="#5f6368">team outcome only — no per-skill label</text>

        <line x1="184" y1="80" x2="184" y2="106" stroke="#9aa0a6" stroke-width="1.6" marker-end="url(#ar)"/>

        <rect x="52" y="114" width="264" height="92" rx="13" fill="#fff" stroke="#1a73e8" stroke-width="1.8"/>
        <g transform="translate(84,160)">
          <circle r="17" fill="#e8f0fe"/>
          <path d="M0,-11 L2.6,-3 L11,0 L2.6,3 L0,11 L-2.6,3 L-11,0 L-2.6,-3 Z" fill="#1a73e8"/>
        </g>
        <text x="112" y="152" font-size="15" font-weight="600" fill="#202124">LLM Critic</text>
        <text x="112" y="171" font-size="12.5" fill="#5f6368">“did this skill help, hurt,</text>
        <text x="112" y="188" font-size="12.5" fill="#5f6368">or add nothing?”</text>

        <rect x="52" y="218" width="264" height="34" rx="9" fill="#fff3e0" stroke="#f0c078"/>
        <text x="184" y="240" text-anchor="middle" font-size="12.5" fill="#8a5300">counterfactual: with k vs. without k</text>

        <g stroke="#9aa0a6" stroke-width="1.5" fill="none" marker-end="url(#ar)">
          <path d="M184,252 C184,272 104,268 104,290"/>
          <path d="M184,252 C184,272 264,268 264,290"/>
        </g>

        <!-- two credit levels -->
        <rect x="24" y="300" width="152" height="118" rx="11" fill="#fff" stroke="#d2e0ef"/>
        <text x="100" y="324" text-anchor="middle" font-size="12.5" font-weight="600" fill="#202124">Agent Credit</text>
        <text x="38" y="348" font-size="12" fill="#3c4043">“Agent B correctly</text>
        <text x="38" y="365" font-size="12" fill="#3c4043">synthesized evidence</text>
        <text x="38" y="382" font-size="12" fill="#3c4043">across sessions…”</text>
        <text x="38" y="404" font-size="12" fill="#5f6368">↳ residual: what no</text>
        <text x="38" y="414" font-size="12" fill="#5f6368">   single skill explains</text>

        <rect x="192" y="300" width="152" height="118" rx="11" fill="#fff" stroke="#b60000" stroke-width="1.5"/>
        <text x="268" y="324" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b60000">Skill Credit</text>
        <text x="206" y="348" font-size="12" fill="#3c4043">“k₁ linked the two</text>
        <text x="206" y="365" font-size="12" fill="#3c4043">entities and drove the</text>
        <text x="206" y="382" font-size="12" fill="#3c4043">correct answer.”</text>
        <text x="206" y="404" font-size="12" fill="#5f6368">↳ per invocation,</text>
        <text x="206" y="414" font-size="12" fill="#5f6368">   not per episode</text>

        <rect x="24" y="436" width="320" height="86" rx="11" fill="#fff" stroke="#d2e0ef"/>
        <text x="40" y="460" font-size="12.5" font-weight="600" fill="#202124">Why agent-level isn't enough</text>
        <text x="40" y="482" font-size="12.5" fill="#3c4043">A skill fires at a few timesteps, tangled</text>
        <text x="40" y="500" font-size="12.5" fill="#3c4043">with other agents' behavior. Only skill-</text>
        <text x="40" y="514" font-size="12.5" fill="#3c4043">level credit says what to edit.</text>

        <rect x="24" y="540" width="320" height="110" rx="11" fill="#d7e7f8"/>
        <text x="44" y="568" font-size="13" font-weight="600" fill="#174ea6">Measured impact</text>
        <text x="44" y="594" font-size="12.5" fill="#3c4043">Removing skill-conditioned credit costs</text>
        <text x="44" y="613" font-size="12.5" fill="#3c4043">6.2 points on GAIA (23.3 → 17.1) and</text>
        <text x="44" y="632" font-size="12.5" fill="#3c4043">3.0 on LoCoMo multi-hop.</text>
      </svg>
    </div>
  </div>

  <!-- ===================== STAGE 3 ===================== -->
  <div class="col c3">
    <div class="badge">Stage 3</div>
    <div class="title">Stabilized<br>Language Gradient</div>
    <div class="panel">
      <svg width="368" height="674" viewBox="0 0 368 674">
        <text x="24" y="42" font-size="13" font-weight="600" fill="#174ea6">Trajectory-level edit directions</text>
        <g font-size="12.5" fill="#3c4043">
          <rect x="24" y="54" width="152" height="30" rx="8" fill="#fff" stroke="#d2e0ef"/>
          <text x="100" y="74" text-anchor="middle">Refinements</text>
          <rect x="192" y="54" width="152" height="30" rx="8" fill="#fff" stroke="#d2e0ef"/>
          <text x="268" y="74" text-anchor="middle">Adjustments</text>
          <rect x="24" y="92" width="152" height="30" rx="8" fill="#fff" stroke="#d2e0ef"/>
          <text x="100" y="112" text-anchor="middle">Generalizations</text>
          <rect x="192" y="92" width="152" height="30" rx="8" fill="#fff" stroke="#d2e0ef"/>
          <text x="268" y="112" text-anchor="middle">Removals</text>
        </g>
        <text x="184" y="140" text-anchor="middle" font-size="12" fill="#5f6368">noisy, contradictory across rollouts</text>

        <line x1="184" y1="148" x2="184" y2="172" stroke="#9aa0a6" stroke-width="1.6" marker-end="url(#ar)"/>

        <!-- hierarchical aggregation staircase -->
        <rect x="24" y="180" width="320" height="192" rx="11" fill="#fff" stroke="#d2e0ef"/>
        <text x="40" y="204" font-size="13.5" font-weight="600" fill="#202124">Hierarchical aggregation</text>
        <g font-size="12" text-anchor="middle">
          <rect x="40" y="216" width="120" height="28" rx="8" fill="#fce8e6"/><text x="100" y="235" fill="#b60000">Trajectories</text>
          <rect x="94" y="252" width="120" height="28" rx="8" fill="#fce8e6"/><text x="154" y="271" fill="#b60000">Skills</text>
          <rect x="148" y="288" width="120" height="28" rx="8" fill="#fce8e6"/><text x="208" y="307" fill="#b60000">Agents</text>
          <rect x="202" y="324" width="120" height="28" rx="8" fill="#fce8e6"/><text x="262" y="343" fill="#b60000">Topologies</text>
        </g>
        <g stroke="#e0a2a2" stroke-width="1.6" fill="none" marker-end="url(#arRed)">
          <path d="M160,230 L176,230 L176,258"/>
          <path d="M214,266 L230,266 L230,294"/>
          <path d="M268,302 L284,302 L284,330"/>
        </g>

        <line x1="184" y1="372" x2="184" y2="396" stroke="#9aa0a6" stroke-width="1.6" marker-end="url(#ar)"/>

        <!-- momentum -->
        <rect x="24" y="404" width="320" height="96" rx="11" fill="#fff" stroke="#d2e0ef"/>
        <text x="40" y="428" font-size="13.5" font-weight="600" fill="#202124">Momentum smoothing</text>
        <g font-size="12" text-anchor="middle">
          <rect x="40" y="442" width="120" height="34" rx="9" fill="#e8f0fe"/><text x="100" y="464" fill="#174ea6">Current</text>
          <text x="176" y="464" font-size="17" fill="#5f6368">+</text>
          <rect x="192" y="442" width="120" height="34" rx="9" fill="#f1f5fa"/><text x="252" y="464" fill="#5f6368">History</text>
        </g>
        <text x="40" y="492" font-size="12" fill="#5f6368">suppresses transient critiques, keeps persistent gains</text>

        <line x1="184" y1="500" x2="184" y2="524" stroke="#b60000" stroke-width="1.8" marker-end="url(#arRed)"/>

        <rect x="24" y="532" width="320" height="52" rx="11" fill="#fff" stroke="#b60000" stroke-width="1.6"/>
        <text x="184" y="563" text-anchor="middle" font-size="13.5" font-weight="600" fill="#b60000">Stable skill-space gradient</text>

        <rect x="24" y="598" width="320" height="52" rx="11" fill="#d7e7f8"/>
        <text x="184" y="622" text-anchor="middle" font-size="12" fill="#3c4043">One pipeline, three topologies: centralized,</text>
        <text x="184" y="640" text-anchor="middle" font-size="12" fill="#3c4043">hierarchical, decentralized peer.</text>
      </svg>
    </div>
  </div>

  <!-- ===================== STAGE 4 ===================== -->
  <div class="col c4">
    <div class="badge">Final Output</div>
    <div class="title">Evolved<br>Skill Library</div>
    <div class="panel">
      <svg width="368" height="674" viewBox="0 0 368 674">
        <text x="24" y="42" font-size="13" font-weight="600" fill="#174ea6">Four credit-driven operators</text>
        <g>
          <rect x="24" y="54" width="152" height="66" rx="10" fill="#fff" stroke="#d2e0ef"/>
          <text x="100" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Refinement</text>
          <text x="100" y="97" text-anchor="middle" font-size="12" fill="#5f6368">localized diff-style</text>
          <text x="100" y="110" text-anchor="middle" font-size="12" fill="#5f6368">edits to a skill</text>

          <rect x="192" y="54" width="152" height="66" rx="10" fill="#fff" stroke="#d2e0ef"/>
          <text x="268" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Induction</text>
          <text x="268" y="97" text-anchor="middle" font-size="12" fill="#5f6368">new skill from</text>
          <text x="268" y="110" text-anchor="middle" font-size="12" fill="#5f6368">hard trajectories</text>

          <rect x="24" y="130" width="152" height="66" rx="10" fill="#fff" stroke="#d2e0ef"/>
          <text x="100" y="154" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Consolidation</text>
          <text x="100" y="173" text-anchor="middle" font-size="12" fill="#5f6368">merge overlapping</text>
          <text x="100" y="186" text-anchor="middle" font-size="12" fill="#5f6368">skills into macros</text>

          <rect x="192" y="130" width="152" height="66" rx="10" fill="#fff" stroke="#d2e0ef"/>
          <text x="268" y="154" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Pruning</text>
          <text x="268" y="173" text-anchor="middle" font-size="12" fill="#5f6368">drop persistently</text>
          <text x="268" y="186" text-anchor="middle" font-size="12" fill="#5f6368">low-utility skills</text>
        </g>

        <line x1="184" y1="196" x2="184" y2="220" stroke="#9aa0a6" stroke-width="1.6" marker-end="url(#ar)"/>

        <rect x="40" y="228" width="288" height="66" rx="11" fill="#fff" stroke="#b60000" stroke-width="1.6"/>
        <text x="184" y="252" text-anchor="middle" font-size="13.5" font-weight="600" fill="#b60000">Validation &amp; Rollback</text>
        <text x="184" y="272" text-anchor="middle" font-size="12" fill="#3c4043">every edit checked on held-out tasks;</text>
        <text x="184" y="287" text-anchor="middle" font-size="12" fill="#3c4043">regressions are reverted</text>

        <line x1="184" y1="294" x2="184" y2="318" stroke="#9aa0a6" stroke-width="1.6" marker-end="url(#ar)"/>

        <rect x="24" y="326" width="320" height="58" rx="11" fill="#fff" stroke="#d2e0ef"/>
        <rect x="40" y="342" width="14" height="12" rx="2.5" fill="#1a73e8" opacity=".85"/>
        <text x="64" y="353" font-size="14" font-weight="600" fill="#202124">Updated Skill Library</text>
        <text x="40" y="374" font-size="12" fill="#5f6368">smaller, sharper, and reusable next episode</text>

        <text x="24" y="414" font-size="13" font-weight="600" fill="#174ea6">Results</text>
        <g>
          <rect x="24" y="426" width="100" height="62" rx="10" fill="#fff" stroke="#d2e0ef"/>
